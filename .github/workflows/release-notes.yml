# Regenerate the notes of an existing GitHub release with Gemini, without building or tagging anything.
# Useful after a Gemini failure (the release workflow falls back to GitHub's generated notes).
#
# Run: gh workflow run release-notes.yml -R melnicorn/critique-obsidian -f version=0.1.3

name: Regenerate release notes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to regenerate notes for (e.g. 0.1.3)'
        required: true
        type: string

jobs:
  notes:
    name: Regenerate notes
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release and previous tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION:  ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist."
            exit 1
          fi
          gh release view "$VERSION" --json tagName >/dev/null || { echo "::error::No GitHub release for tag ${VERSION}."; exit 1; }

          # The previous release is the highest semver tag below this one.
          PREVIOUS_TAG=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | awk -v v="$VERSION" '$0 == v { exit } { last = $0 } END { print last }')
          MIN_APP=$(git show "refs/tags/${VERSION}:manifest.json" | jq -r .minAppVersion)

          echo "Release      : ${VERSION}"
          echo "Previous tag : ${PREVIOUS_TAG:-<none>}"
          echo "Min Obsidian : ${MIN_APP}"
          {
            echo "version=${VERSION}"
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "min_app=${MIN_APP}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate notes with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_ID:       ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          VERSION:        ${{ steps.resolve.outputs.version }}
          PREVIOUS_TAG:   ${{ steps.resolve.outputs.previous_tag }}
          MIN_APP:        ${{ steps.resolve.outputs.min_app }}
          REPO_NAME:      ${{ github.event.repository.name }}
          STRICT: "1"
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set; nothing to regenerate with."
            exit 1
          fi
          bash scripts/release-notes.sh

      - name: Update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION:  ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --notes-file final_notes.md
          echo "Updated $(gh release view "$VERSION" --json url -q .url)"
          {
            echo "### Release notes for v${VERSION}"
            echo
            cat final_notes.md
          } >> "$GITHUB_STEP_SUMMARY"
